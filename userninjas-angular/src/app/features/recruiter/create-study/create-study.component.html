<div class="create-study-page bg-slate-950 text-white min-h-screen pt-24 pb-16 px-4 relative">
  <!-- Glowing Background Orbs -->
  <div class="absolute top-20 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-20 right-1/4 w-96 h-96 bg-purple-500/5 rounded-full blur-[120px] pointer-events-none"></div>

  <main class="max-w-3xl mx-auto space-y-6 relative z-10">
    <!-- Back button -->
    <button
      mat-stroked-button
      [routerLink]="['/recruiter']"
      class="rounded-xl border border-white/10 text-white hover:bg-white/5 text-xs font-semibold gap-1.5 flex items-center py-4"
    >
      <mat-icon class="scale-75">arrow_back</mat-icon> Back
    </button>

    <!-- Form Card -->
    <div class="card bg-slate-900 border border-white/5 shadow-2xl space-y-6">
      <div class="border-b border-white/5 pb-4">
        <h2 class="text-2xl font-bold tracking-tight">Create Research Study</h2>
        <p class="text-xs text-slate-400 mt-1">Customize your study parameters, participant criteria, and research questions.</p>
      </div>

      <form (submit)="$event.preventDefault(); handlePublish()" class="space-y-6">
        
        <!-- 1. Basic Details -->
        <div class="space-y-4">
          <h3 class="text-sm font-bold uppercase tracking-wider border-l-2 border-primary pl-2 text-indigo-400">
            1. Basic Details
          </h3>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="input-group">
              <label class="text-xs font-semibold text-slate-300">Study Title *</label>
              <input
                [(ngModel)]="title"
                name="title"
                placeholder="e.g. Website Navigation Friction"
                required
                class="form-input text-xs"
              />
            </div>

            <div class="input-group">
              <label class="text-xs font-semibold text-slate-300">Research Category</label>
              <select [(ngModel)]="category" name="category" class="form-select text-xs">
                <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="input-group">
              <label class="text-xs font-semibold text-slate-300">Study Format</label>
              <select [(ngModel)]="testType" name="testType" class="form-select text-xs">
                <option *ngFor="let format of testFormats" [value]="format.id">{{ format.label }}</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div class="input-group">
                <label class="text-xs font-semibold text-slate-300 flex items-center gap-1">
                  <mat-icon class="scale-75 text-slate-500">schedule</mat-icon> Duration (mins)
                </label>
                <input
                  type="number"
                  min="1"
                  max="180"
                  [(ngModel)]="duration"
                  name="duration"
                  required
                  class="form-input text-xs"
                />
              </div>
              <div class="input-group">
                <label class="text-xs font-semibold text-slate-300 flex items-center gap-1">
                  <mat-icon class="scale-75 text-slate-500">stars</mat-icon> Reward ($)
                </label>
                <input
                  type="number"
                  min="1"
                  max="500"
                  [(ngModel)]="reward"
                  name="reward"
                  required
                  class="form-input text-xs"
                />
              </div>
            </div>
          </div>

          <div class="input-group">
            <label class="text-xs font-semibold text-slate-300">Description</label>
            <textarea
              [(ngModel)]="description"
              name="description"
              placeholder="Briefly describe your study. What will participants be doing?"
              rows="3"
              class="form-textarea text-xs"
            ></textarea>
          </div>
        </div>

        <!-- 2. Objectives & Targeting -->
        <div class="space-y-4 pt-2">
          <h3 class="text-sm font-bold uppercase tracking-wider border-l-2 border-primary pl-2 text-indigo-400">
            2. Targeting & Objectives
          </h3>
          
          <div class="space-y-4">
            <div class="input-group">
              <label class="text-xs font-semibold text-slate-300 flex items-center gap-1">
                <mat-icon class="scale-75 text-amber-500">track_changes</mat-icon> Study Objective
              </label>
              <input
                [(ngModel)]="objective"
                name="objective"
                placeholder="What specific question or hypothesis are you trying to answer?"
                class="form-input text-xs"
              />
            </div>

            <div class="input-group">
              <label class="text-xs font-semibold text-slate-300 flex items-center gap-1">
                <mat-icon class="scale-75 text-primary">groups</mat-icon> Participant Demographics / Criteria
              </label>
              <input
                [(ngModel)]="participantCriteria"
                name="participantCriteria"
                placeholder="e.g. Android users, E-commerce shoppers, SaaS users aged 25-45"
                class="form-input text-xs"
              />
            </div>
          </div>
        </div>

        <!-- 3. Research Questions -->
        <div class="space-y-4 pt-2">
          <div class="flex items-center justify-between border-l-2 border-primary pl-2">
            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-400">
              3. Research Questions
            </h3>
            <button
              type="button"
              (click)="addQuestion()"
              mat-stroked-button
              class="border-primary/20 text-primary hover:bg-primary/5 text-[10px] h-7 flex items-center"
            >
              <mat-icon class="scale-75 mr-0.5">add</mat-icon> Add Question
            </button>
          </div>

          <div class="space-y-4">
            <div *ngFor="let q of questions; let qIdx = index; trackBy: trackByIndex" class="p-4 rounded-xl bg-white/[0.01] border border-white/5 space-y-3">
              
              <!-- Question Number & Remove -->
              <div class="flex items-center justify-between gap-4">
                <span class="text-[10px] font-bold text-slate-500 uppercase">
                  Question {{ qIdx + 1 }}
                </span>
                <button
                  type="button"
                  (click)="removeQuestion(qIdx)"
                  class="delete-icon-btn"
                >
                  <mat-icon class="scale-90">delete</mat-icon>
                </button>
              </div>

              <!-- Question Text & Type selector -->
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="md:col-span-2">
                  <input
                    [(ngModel)]="q.question_text"
                    [name]="'q-text-' + qIdx"
                    placeholder="Type your question here..."
                    required
                    class="form-input text-xs w-full"
                  />
                </div>
                <div>
                  <select 
                    [ngModel]="q.question_type" 
                    [name]="'q-type-' + qIdx"
                    (ngModelChange)="onQuestionTypeChange(qIdx, $event)"
                    class="form-select text-xs w-full"
                  >
                    <option value="open_text">Open Text</option>
                    <option value="mcq">Multiple Choice</option>
                    <option value="rating">Rating (1-5)</option>
                    <option value="yes_no">Yes / No</option>
                  </select>
                </div>
              </div>

              <!-- MCQ Options editor -->
              <div *ngIf="q.question_type === 'mcq'" class="pl-6 border-l border-white/5 space-y-2 pt-1">
                <div class="flex items-center justify-between">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">
                    Multiple Choice Options
                  </span>
                  <button
                    type="button"
                    (click)="addOption(qIdx)"
                    class="text-[10px] text-primary font-semibold flex items-center hover:underline"
                  >
                    <mat-icon class="scale-75 mr-0.5">add</mat-icon> Add Option
                  </button>
                </div>
                <div class="space-y-1.5">
                  <div *ngFor="let opt of q.options; let oIdx = index; trackBy: trackByIndex" class="flex items-center gap-2">
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-500"></div>
                    <input
                      [(ngModel)]="q.options[oIdx]"
                      [name]="'q-' + qIdx + '-opt-' + oIdx"
                      required
                      class="form-input text-xs flex-1 py-1"
                    />
                    <button
                      type="button"
                      *ngIf="q.options.length > 2"
                      (click)="removeOption(qIdx, oIdx)"
                      class="delete-icon-btn py-1"
                    >
                      <mat-icon class="scale-75">close</mat-icon>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Required toggle -->
              <div class="flex items-center gap-2 pt-1">
                <input
                  type="checkbox"
                  [id]="'req-' + qIdx"
                  [(ngModel)]="q.required"
                  [name]="'q-req-' + qIdx"
                  class="rounded border-white/10 bg-slate-900 w-3.5 h-3.5 cursor-pointer"
                />
                <label [htmlFor]="'req-' + qIdx" class="text-[10px] font-medium text-slate-400 select-none cursor-pointer">
                  Required Question
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- Publish & Cancel Buttons -->
        <div class="flex justify-end gap-3 pt-4 border-t border-white/5">
          <button
            type="button"
            mat-stroked-button
            [routerLink]="['/recruiter']"
            class="rounded-xl border-white/10 text-white hover:bg-white/5 text-xs h-10 px-5"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="saving()"
            mat-flat-button
            color="primary"
            class="bg-gradient-to-r from-primary to-purple-600 text-white rounded-xl gap-1 text-xs h-10 px-6 font-bold flex items-center"
          >
            <mat-icon class="scale-75 mr-0.5">save</mat-icon>
            {{ saving() ? 'Publishing...' : 'Publish Study' }}
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
