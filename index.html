<!doctype html>
<html lang="en">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.userninjas.in/" />

    <!-- User Ninjas - AI-Powered UX Research Platform -->

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6366f1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="User Ninjas" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="User Ninjas - AI-Powered UX Research Platform" />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Structured Data (JSON-LD) for Better SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "User Ninjas",
      "alternateName": "User Ninjas - UX Research Platform",

      "image": "https://www.userninjas.in/og-image.png",
      "applicationCategory": "ProductionApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "USD",
        "price": "0"
      }
    }
    </script>

    <!-- Additional JSON-LD Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "User Ninjas",
      "url": "https://www.userninjas.in",
      "logo": "https://www.userninjas.in/logo.png",

        "https://twitter.com/UserNinjas"
      ],
      "contact": {
        "@type": "ContactPoint",

        "url": "https://www.userninjas.in/contact"
      }
    }
    </script>
